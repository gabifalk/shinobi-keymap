name: Publish to PyPI

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    # Required for PyPI trusted publishing (OIDC).
    permissions:
      id-token: write

    # Configure the matching environment in PyPI's trusted-publisher settings.
    environment:
      name: pypi
      url: https://pypi.org/p/shinobi-keymap

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
